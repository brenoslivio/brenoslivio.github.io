name: Update Spotify status

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-spotify.yml"
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Fetch currently playing track
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for name in SPOTIFY_CLIENT_ID SPOTIFY_CLIENT_SECRET SPOTIFY_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

          token_response=$(curl --silent --show-error --fail \
            --request POST \
            --url "https://accounts.spotify.com/api/token" \
            --user "$SPOTIFY_CLIENT_ID:$SPOTIFY_CLIENT_SECRET" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$SPOTIFY_REFRESH_TOKEN")

          access_token=$(jq --exit-status --raw-output '.access_token' <<<"$token_response")
          response_file="$RUNNER_TEMP/spotify-response.json"
          output_file="$RUNNER_TEMP/spotify.json"
          updated_at=$(date --utc +"%Y-%m-%dT%H:%M:%SZ")

          http_status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $access_token" \
            "https://api.spotify.com/v1/me/player/currently-playing")

          case "$http_status" in
            200)
              jq --arg updatedAt "$updated_at" '{
                isPlaying: (.is_playing == true),
                track: (.item.name // ""),
                artist: (
                  if ((.item.artists? // []) | length) > 0
                  then ([.item.artists[].name] | join(", "))
                  else (.item.show.publisher // .item.show.name // "")
                  end
                ),
                album: (.item.album.name // .item.show.name // ""),
                albumArt: (.item.album.images[0].url // .item.images[0].url // ""),
                spotifyUrl: (.item.external_urls.spotify // ""),
                progressMs: (.progress_ms // 0),
                durationMs: (.item.duration_ms // 0),
                updatedAt: $updatedAt
              }' "$response_file" > "$output_file"
              ;;
            204)
              jq --null-input --arg updatedAt "$updated_at" '{
                isPlaying: false,
                track: "",
                artist: "",
                album: "",
                albumArt: "",
                spotifyUrl: "",
                progressMs: 0,
                durationMs: 0,
                updatedAt: $updatedAt
              }' > "$output_file"
              ;;
            *)
              echo "Spotify currently-playing endpoint returned HTTP $http_status" >&2
              exit 1
              ;;
          esac

      - name: Publish status without growing branch history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan spotify-data
          git rm --recursive --force . 2>/dev/null || true
          cp "$RUNNER_TEMP/spotify.json" spotify.json
          git add spotify.json
          git commit --message "Update Spotify status"
          git push --force origin HEAD:spotify-data
