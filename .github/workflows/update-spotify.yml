name: Update Spotify status

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-spotify.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Fetch currently playing track
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for name in SPOTIFY_CLIENT_ID SPOTIFY_CLIENT_SECRET SPOTIFY_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

          token_response=$(curl --silent --show-error --fail \
            --request POST \
            --url "https://accounts.spotify.com/api/token" \
            --user "$SPOTIFY_CLIENT_ID:$SPOTIFY_CLIENT_SECRET" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$SPOTIFY_REFRESH_TOKEN")

          access_token=$(jq --exit-status --raw-output '.access_token' <<<"$token_response")
          response_file="$RUNNER_TEMP/spotify-response.json"
          output_file="$RUNNER_TEMP/spotify.json"
          previous_file="$RUNNER_TEMP/spotify-previous.json"
          updated_at=$(date --utc +"%Y-%m-%dT%H:%M:%SZ")

          if ! git fetch --depth=1 origin spotify-data || ! git show FETCH_HEAD:spotify.json > "$previous_file"; then
            jq --null-input '{}' > "$previous_file"
          fi

          http_status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $access_token" \
            "https://api.spotify.com/v1/me/player/currently-playing")

          case "$http_status" in
            200)
              jq --arg updatedAt "$updated_at" '{
                isPlaying: (.is_playing == true),
                isFallback: (.is_playing != true),
                track: (.item.name // ""),
                artist: (
                  if ((.item.artists? // []) | length) > 0
                  then ([.item.artists[].name] | join(", "))
                  else (.item.show.publisher // .item.show.name // "")
                  end
                ),
                album: (.item.album.name // .item.show.name // ""),
                albumArt: (.item.album.images[0].url // .item.images[0].url // ""),
                spotifyUrl: (.item.external_urls.spotify // ""),
                progressMs: (.progress_ms // 0),
                durationMs: (.item.duration_ms // 0),
                lastPlayedAt: $updatedAt,
                updatedAt: $updatedAt
              }' "$response_file" > "$output_file"
              ;;
            204)
              jq --arg updatedAt "$updated_at" '
                if ((.track // "") | length) > 0 then
                  . + {
                    isPlaying: false,
                    isFallback: true,
                    progressMs: 0,
                    lastPlayedAt: (.lastPlayedAt // .updatedAt // $updatedAt),
                    updatedAt: $updatedAt
                  }
                else
                  {
                    isPlaying: false,
                    isFallback: false,
                    track: "",
                    artist: "",
                    album: "",
                    albumArt: "",
                    spotifyUrl: "",
                    progressMs: 0,
                    durationMs: 0,
                    lastPlayedAt: "",
                    updatedAt: $updatedAt
                  }
                end
              ' "$previous_file" > "$output_file"
              ;;
            *)
              echo "Spotify currently-playing endpoint returned HTTP $http_status" >&2
              exit 1
              ;;
          esac

      - name: Build GitHub profile card
        run: |
          python3 - <<'PY'
          import base64
          import html
          import json
          import os
          import sys
          import urllib.request

          runner_temp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(runner_temp, "spotify.json"), encoding="utf-8") as source:
              status = json.load(source)

          def shorten(value, limit):
              value = " ".join(str(value or "").split())
              return value if len(value) <= limit else value[: limit - 1].rstrip() + "…"

          playing = bool(status.get("isPlaying"))
          has_track = bool(status.get("track"))
          label = "LISTENING NOW" if playing else "LAST PLAYED" if has_track else "SPOTIFY"
          track = shorten(status.get("track"), 36) if has_track else "Nothing playing right now"
          artist = shorten(status.get("artist"), 42) if has_track else "Check back later"
          album = shorten(status.get("album"), 48) if has_track else ""
          title = f"{track} by {artist}" if has_track else track

          artwork_data = ""
          artwork_url = status.get("albumArt", "") if has_track else ""
          if artwork_url:
              try:
                  request = urllib.request.Request(artwork_url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      mime_type = response.headers.get_content_type()
                      artwork_data = f"data:{mime_type};base64," + base64.b64encode(response.read()).decode()
              except Exception as error:
                  print(f"Album artwork unavailable: {type(error).__name__}", file=sys.stderr)

          if artwork_data:
              cover = (
                  '<image x="12" y="12" width="96" height="96" '
                  'preserveAspectRatio="xMidYMid slice" clip-path="url(#cover)" '
                  f'href="{artwork_data}"/>'
              )
          else:
              cover = '''
                <rect x="12" y="12" width="96" height="96" rx="7" fill="#202020"/>
                <circle cx="60" cy="60" r="27" fill="#1db954"/>
                <path d="M43 52c12-4 27-3 37 3M45 61c10-3 23-2 32 3M47 70c8-2 18-1 26 2"
                      fill="none" stroke="#121212" stroke-width="4" stroke-linecap="round"/>
              '''

          album_line = (
              f'<text x="126" y="102" fill="#777777" font-size="11">{html.escape(album)}</text>'
              if album else ""
          )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="460" height="120" viewBox="0 0 460 120" role="img" aria-labelledby="title description">
            <title id="title">{html.escape(title)}</title>
            <desc id="description">Breno's current Spotify listening status</desc>
            <defs>
              <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1db954" stop-opacity="0.85"/>
                <stop offset="0.55" stop-color="#973caa" stop-opacity="0.65"/>
                <stop offset="1" stop-color="#de0be6" stop-opacity="0.75"/>
              </linearGradient>
              <clipPath id="cover"><rect x="12" y="12" width="96" height="96" rx="7"/></clipPath>
            </defs>
            <rect x="1" y="1" width="458" height="118" rx="10" fill="#121212" stroke="url(#border)" stroke-width="2"/>
            {cover}
            <circle cx="130" cy="26" r="6" fill="#1db954"/>
            <text x="143" y="30" fill="#1db954" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">{label}</text>
            <text x="126" y="60" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">{html.escape(track)}</text>
            <text x="126" y="83" fill="#b3b3b3" font-family="Inter,Arial,sans-serif" font-size="13">{html.escape(artist)}</text>
            {album_line}
          </svg>'''

          with open(os.path.join(runner_temp, "spotify.svg"), "w", encoding="utf-8") as output:
              output.write(svg)
          PY

      - name: Publish status without growing branch history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan spotify-data
          git rm --recursive --force . 2>/dev/null || true
          cp "$RUNNER_TEMP/spotify.json" spotify.json
          cp "$RUNNER_TEMP/spotify.svg" spotify.svg
          git add spotify.json spotify.svg
          git commit --message "Update Spotify status"
          git push --force origin HEAD:spotify-data
